<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reel2Real</title>
  <meta name="description" content="Turn saved reels and YouTube videos into learnings, experiments and wins on your real projects.">
  <meta name="theme-color" content="#f3f4f0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><span>Reel2Real</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="active">Tracker</button>
      <button data-tab="library">Videos</button>
      <button data-tab="lab">Projects</button>
      <button data-tab="map">Insights</button>
    </nav>
    <div class="vitals" id="vitals"></div>
    <button class="icon-btn" data-action="open-settings">Settings</button>
  </header>

  <main>
    <section id="view-today" class="view" data-view="today"></section>
    <section id="view-library" class="view" data-view="library" hidden></section>
    <section id="view-lab" class="view" data-view="lab" hidden></section>
    <section id="view-map" class="view" data-view="map" hidden></section>
  </main>


  <dialog id="modal"><form method="dialog" id="modal-body"></form></dialog>
  <dialog id="confirm" class="confirm"><form method="dialog">
    <p></p>
    <div class="row end"><button class="btn ghost" value="cancel">Cancel</button><button class="btn primary" value="ok">Delete</button></div>
  </form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
