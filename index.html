<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reel2Real</title>
  <meta name="description" content="Turn saved reels and YouTube videos into learnings, experiments and wins on your real projects.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Reel<b>2</b>Real</span>
    </div>
    <div class="vitals" id="vitals"></div>
    <button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <section id="view-today" class="view" data-view="today"></section>
    <section id="view-library" class="view" data-view="library" hidden></section>
    <section id="view-lab" class="view" data-view="lab" hidden></section>
    <section id="view-map" class="view" data-view="map" hidden></section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active"><span>⚡</span>Today</button>
    <button data-tab="library"><span>🎞️</span>Library</button>
    <button data-tab="lab"><span>🧪</span>Lab</button>
    <button data-tab="map"><span>🧠</span>Brain</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-body"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
