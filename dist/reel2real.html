  <style>
/* Layout: a working tracker. Calm paper-grey ground, ink text, one blue accent for actions, green for done. */
:root {
  --bg: #f3f4f0;
  --surface: #ffffff;
  --sunk: #ebece7;
  --ink: #16181a;
  --muted: #5d635e;
  --line: #d9dbd4;
  --accent: #2f5bea;
  --accent-ink: #ffffff;
  --done: #1d7f55;
  --warn: #a15c07;
  --danger: #b4232a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111312; --surface: #191c1a; --sunk: #222623; --ink: #eceee9; --muted: #9ba29c;
    --line: #2d322e; --accent: #7f9cff; --accent-ink: #0d1020; --done: #4cc38a; --warn: #e3a248; --danger: #f07178;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111312; --surface: #191c1a; --sunk: #222623; --ink: #eceee9; --muted: #9ba29c;
  --line: #2d322e; --accent: #7f9cff; --accent-ink: #0d1020; --done: #4cc38a; --warn: #e3a248; --danger: #f07178;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 24px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 24px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font: 700 18px/1 var(--font-display); letter-spacing: -0.02em; }
.vitals { margin-left: auto; font: 12px var(--font-mono); color: var(--muted); }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: 1px; }
.sync.on::before { background: var(--done); }
.icon-btn { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--muted); font-weight: 500; }
.icon-btn:hover { color: var(--ink); }

.tabs { display: flex; gap: 4px; }
.tabs button {
  border: 0; background: none; cursor: pointer; padding: 6px 12px; border-radius: 8px;
  color: var(--muted); font-weight: 500;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--ink); background: var(--sunk); font-weight: 600; }

/* ---------- page ---------- */
main { max-width: 880px; margin: 0 auto; padding: 28px 24px 40px; }
.view { display: grid; gap: 16px; }
[hidden], .view[hidden] { display: none !important; }
.view > * { margin: 0; min-width: 0; }
h2 {
  font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 16px 0 0;
}
.hero { font: 700 30px/1.15 var(--font-display); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.hero em { font-style: normal; color: var(--accent); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.hint { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

/* ---------- forms ---------- */
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.field label, .cap-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.cap-label { font: 700 18px/1.2 var(--font-display); margin: 0; }
.capture input[name=url], .capture textarea, .field input, .field textarea, .field select, .search {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; outline: none;
}
.capture textarea, .field textarea { resize: vertical; min-height: 72px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
.ai-box { padding: 12px; border-radius: 8px; background: var(--sunk); }

.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.watch { color: var(--accent); border-color: transparent; background: transparent; padding-inline: 6px; }
.btn.watch:hover { text-decoration: underline; }
.btn:disabled { opacity: .5; cursor: default; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
.linkish:hover { text-decoration: underline; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --c: var(--muted);
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 500; cursor: pointer; user-select: none;
}
.chip::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.chip:has(input:not(:checked)), .chip.off { color: var(--muted); }
.chip:has(input:not(:checked))::before, .chip.off::before { background: var(--line); }
.chip:has(input:checked) { border-color: var(--ink); }
.chip.static { cursor: default; }

/* ---------- action point feed ---------- */
.todo-feed { display: grid; gap: 0; padding: 4px 16px; }
.todo-feed .step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
.todo-feed .step:last-child { border-bottom: 0; }
.todo-feed .step small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--done); flex: none; cursor: pointer; }

/* ---------- video tracker card ---------- */
.card.video { padding: 0; overflow: hidden; }
.vhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.plat {
  flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; text-decoration: none;
  font: 500 11px var(--font-mono); background: var(--sunk); color: var(--muted);
}
.vtitle { flex: 1; min-width: 0; }
.vhead .title { font-weight: 600; overflow-wrap: anywhere; }
.meta { font: 12px var(--font-mono); color: var(--muted); }

.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1.25fr 1fr; }
.flow .step { padding: 14px 16px; display: grid; gap: 8px; align-content: start; border-left: 1px solid var(--line); min-width: 0; }
.flow .step:first-child { border-left: 0; }
.flow h4 {
  margin: 0; display: flex; align-items: baseline; gap: 8px;
  font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.flow h4 span { color: var(--muted); }
.flow .step.on h4 span { color: var(--done); }
.flow .step.on h4 span::after { content: " ✓"; }
.flow h4 em { font-style: normal; margin-left: auto; text-transform: none; letter-spacing: 0; }
.flow p { margin: 0; overflow-wrap: anywhere; }
.flow .btn { justify-self: start; }
.flow ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flow li label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.flow li.done span { text-decoration: line-through; color: var(--muted); }
.working { font-style: italic; }
.working::after { content: ""; display: inline-block; width: 1em; animation: dots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.status { font: 500 12px var(--font-mono); padding: 1px 6px; border-radius: 4px; background: var(--sunk); }
.status.s-won { color: var(--done); }
.status.s-flopped { color: var(--danger); }
.status.s-testing { color: var(--accent); }
.player { padding: 0 16px 12px; }
.player iframe { display: block; width: 100%; max-width: 360px; aspect-ratio: 9 / 16; max-height: 70vh; border: 0; border-radius: 8px; background: #000; }
.card.video > .linkish { margin: 10px 16px 0; font-size: 13px; }

/* ---------- library filters ---------- */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ---------- projects ---------- */
.project-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.project-head .dot { width: 10px; height: 10px; border-radius: 50%; }
.project-head h3 { margin: 0; font: 700 18px var(--font-display); }
.project-head .row { margin-left: auto; }
.exp { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.exp .plan { font-weight: 600; white-space: pre-line; }
.exp .from { font-size: 13px; color: var(--muted); margin-top: 2px; }
.exp .result { font-size: 13px; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--done); }
.exp.flopped .result { border-left-color: var(--danger); }
.status-row { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.status-row button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.status-row button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- insights ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.stat b { display: block; font: 700 24px var(--font-display); }
.stat span { font: 11px var(--font-mono); color: var(--muted); text-transform: uppercase; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: center; font-size: 13px; }
.bar-row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink) !important; }
.bar { height: 10px; background: var(--sunk); border-radius: 3px; display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar-row .num { color: var(--muted); font: 12px var(--font-mono); text-align: right; min-width: 72px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); opacity: var(--o, 1); }
.funnel { display: grid; gap: 6px; }
.funnel div { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.funnel b { height: 24px; border-radius: 4px; background: var(--ink); color: var(--bg); display: flex; align-items: center; padding: 0 8px; font: 500 12px var(--font-mono); min-width: 30px; }
.funnel span { color: var(--muted); }
details summary { cursor: pointer; padding: 6px 0; }

.empty { color: var(--muted); }
.empty p { margin: 0; }
.search { background: var(--surface); }

/* ---------- dialogs ---------- */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
#modal-body { padding: 20px; }
#modal-body h3 { margin: 0 0 4px; font: 700 20px var(--font-display); }
#confirm { width: min(380px, calc(100vw - 32px)); }
#confirm form { padding: 18px; display: grid; gap: 14px; }
#confirm p { margin: 0; font-weight: 600; }

#toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px);
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-weight: 500; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100vw - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
code { font: 12px var(--font-mono); word-break: break-all; background: var(--sunk); padding: 1px 4px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- phone ---------- */
@media (max-width: 720px) {
  .top { padding-inline: 16px; gap: 12px; }
  main { padding: 20px 16px 32px; }
  .hero { font-size: 24px; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .tabs button { padding: 10px 4px; font-size: 13px; }
  .flow { grid-template-columns: 1fr; }
  .flow .step { border-left: 0; border-top: 1px solid var(--line); }
  .flow .step:first-child { border-top: 0; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .bar-row { grid-template-columns: 84px 1fr auto; }
}
@media (min-width: 721px) { body { padding-bottom: 0; } #toast { bottom: 24px; } }

</style>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxNjE4MWEiLz4KICA8cGF0aCBkPSJNMjQgMTggTDQ2IDMyIEwyNCA0NiBaIiBmaWxsPSIjZjNmNGYwIi8+CiAgPHJlY3QgeD0iMTQiIHk9IjUwIiB3aWR0aD0iMzYiIGhlaWdodD0iNCIgcng9IjIiIGZpbGw9IiMyZjViZWEiLz4KPC9zdmc+Cg==" alt="" width="22" height="22"><span>Reel2Real</span></div>

  <script type="module">
// Pure logic for Reel2Real — no DOM access, so it can be unit-tested with `node --test`.

const TOPICS = [
  { id: 'aeo', name: 'AEO', color: '#f59e0b',
    keywords: ['aeo', 'answer engine', 'featured snippet', 'people also ask', 'voice search', 'zero click', 'zero-click', 'faq schema'] },
  { id: 'geo', name: 'GEO', color: '#10b981',
    keywords: ['geo', 'generative engine', 'ai overview', 'ai overviews', 'perplexity', 'llm seo', 'ai search', 'cited by ai', 'chatgpt search', 'llms.txt', 'ai citation'] },
  { id: 'seo', name: 'SEO', color: '#3b82f6',
    keywords: ['seo', 'backlink', 'backlinks', 'serp', 'keyword research', 'search console', 'gsc', 'on-page', 'technical seo', 'schema', 'sitemap', 'ranking', 'rank on google', 'internal link', 'google discover'] },
  { id: 'meta', name: 'Meta Ads', color: '#6366f1',
    keywords: ['meta ads', 'facebook ads', 'instagram ads', 'fb ads', 'andromeda', 'advantage+', 'advantage plus', 'meta pixel', 'capi', 'conversions api', 'cbo', 'abo', 'ad set', 'ads manager', 'meta algorithm'] },
  { id: 'google', name: 'Google Ads', color: '#ef4444',
    keywords: ['google ads', 'ppc', 'pmax', 'performance max', 'search ads', 'quality score', 'adwords', 'negative keyword', 'negative keywords', 'search terms', 'smart bidding', 'tcpa', 'troas'] },
  { id: 'social', name: 'Social Media', color: '#ec4899',
    keywords: ['social media', 'reels', 'reel', 'tiktok', 'linkedin', 'content calendar', 'hook', 'hooks', 'engagement', 'followers', 'carousel', 'instagram growth', 'personal brand', 'viral'] },
  { id: 'ai', name: 'AI', color: '#8b5cf6',
    keywords: ['ai', 'chatgpt', 'claude', 'gemini', 'gpt', 'llm', 'prompt', 'prompts', 'automation', 'ai agent', 'agents', 'n8n', 'make.com', 'zapier', 'mcp'] },
  { id: 'video', name: 'Video Creation', color: '#14b8a6',
    keywords: ['video editing', 'capcut', 'premiere', 'b-roll', 'broll', 'script', 'ugc', 'voiceover', 'higgsfield', 'veo', 'runway', 'kling', 'thumbnail', 'avatar video', 'ai video', 'talking head'] },
];

const STAGES = ['saved', 'watched', 'learned'];
const EXP_STATUSES = [
  { id: 'queued', label: 'Queued', emoji: '⏳' },
  { id: 'testing', label: 'Testing', emoji: '🧪' },
  { id: 'won', label: 'Worked', emoji: '🏆' },
  { id: 'flopped', label: "Didn't work", emoji: '🧊' },
];

const XP = { saved: 1, watched: 2, learned: 5, applied: 10, won: 25 };
const DAY = 86400000;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function emptyState() {
  return { version: 1, videos: [], projects: [], experiments: [], customTopics: [] };
}

function allTopics(state) {
  return [...TOPICS, ...(state?.customTopics || [])];
}

/** Pull the first http(s) URL out of arbitrary shared text (Instagram's share sheet puts it in `text`). */
function extractUrl(text) {
  if (!text) return '';
  const m = String(text).match(/https?:\/\/[^\s<>"']+/i);
  return m ? m[0].replace(/[),.;!?]+$/, '') : '';
}

/** Every distinct video link in a block of text (one per line, or mixed with captions). */
function extractUrls(text) {
  const out = [];
  const seen = new Set();
  for (const m of String(text || '').matchAll(/https?:\/\/[^\s<>"']+/gi)) {
    const url = m[0].replace(/[),.;!?]+$/, '');
    const key = normalizeUrl(url);
    if (!seen.has(key)) { seen.add(key); out.push(url); }
  }
  return out;
}

function detectPlatform(url) {
  const u = String(url || '').toLowerCase();
  if (/(^|\/\/|\.)instagram\.com|instagr\.am/.test(u)) return 'instagram';
  if (/(^|\/\/|\.)(youtube\.com|youtu\.be)/.test(u)) return 'youtube';
  if (/(^|\/\/|\.)tiktok\.com/.test(u)) return 'tiktok';
  if (/(^|\/\/|\.)linkedin\.com/.test(u)) return 'linkedin';
  return 'web';
}

/** Canonical form used to detect duplicates (drops tracking params like ?igsh= / ?si=). */
function normalizeUrl(url) {
  let parsed;
  try { parsed = new URL(url); } catch { return String(url || '').trim(); }
  const host = parsed.hostname.replace(/^(www\.|m\.)/, '');
  const path = parsed.pathname;
  if (host === 'instagram.com' || host === 'instagr.am') {
    const m = path.match(/^\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/);
    if (m) return `https://www.instagram.com/${m[1] === 'reels' ? 'reel' : m[1]}/${m[2]}/`;
  }
  if (host === 'youtu.be') {
    const id = path.slice(1).split('/')[0];
    if (id) return `https://www.youtube.com/watch?v=${id}`;
  }
  if (host === 'youtube.com') {
    const shorts = path.match(/^\/(shorts|live|embed)\/([\w-]+)/);
    if (shorts) return `https://www.youtube.com/watch?v=${shorts[2]}`;
    const v = parsed.searchParams.get('v');
    if (v) return `https://www.youtube.com/watch?v=${v}`;
  }
  return `${parsed.protocol}//${host}${path.replace(/\/+$/, '') || '/'}`;
}

/** Player URL for showing the video inside the app (Instagram/YouTube embeds), or '' if not embeddable. */
function embedUrl(url) {
  const key = normalizeUrl(url);
  const ig = key.match(/^https:\/\/www\.instagram\.com\/(reel|p|tv)\/([\w-]+)\/$/);
  if (ig) return `https://www.instagram.com/${ig[1]}/${ig[2]}/embed/captioned/`;
  const yt = key.match(/^https:\/\/www\.youtube\.com\/watch\?v=([\w-]+)$/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  return '';
}

const PLATFORM_LABEL = { instagram: 'Instagram', youtube: 'YouTube', tiktok: 'TikTok', linkedin: 'LinkedIn', web: 'Web' };

/** Human label for a saved link with no title or note yet, e.g. "Instagram reel" / "YouTube Short". */
function linkLabel(url) {
  const platform = detectPlatform(url);
  const u = String(url).toLowerCase();
  if (platform === 'instagram') return u.includes('/p/') ? 'Instagram post' : 'Instagram reel';
  if (platform === 'youtube') return u.includes('/shorts/') ? 'YouTube Short' : 'YouTube video';
  return `${PLATFORM_LABEL[platform]} link`;
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/** Guess topics from a caption / note / title. Returns topic ids, strongest match first. */
function suggestTopics(text, topics = TOPICS) {
  const t = ` ${String(text || '').toLowerCase()} `;
  const scored = [];
  for (const topic of topics) {
    let score = 0;
    for (const kw of [topic.name.toLowerCase(), ...(topic.keywords || [])]) {
      const re = new RegExp(`(^|[^a-z0-9])${escapeRe(kw.toLowerCase())}([^a-z0-9]|$)`, 'g');
      const hits = t.match(re);
      if (hits) score += hits.length * (kw.includes(' ') ? 2 : 1);
    }
    if (score > 0) scored.push({ id: topic.id, score });
  }
  return scored.sort((a, b) => b.score - a.score).map(s => s.id);
}

function createVideo({ url, note = '', title = '', topics = [] }, now = Date.now()) {
  return {
    id: uid(),
    url: url.trim(),
    key: normalizeUrl(url),
    platform: detectPlatform(url),
    title: title.trim(),
    note: note.trim(),
    topics: [...new Set(topics)],
    stage: 'saved',
    insight: '',
    idea: '',
    addedAt: now,
    watchedAt: null,
    learnedAt: null,
  };
}

function findDuplicate(state, url) {
  const key = normalizeUrl(url);
  return state.videos.find(v => v.key === key) || null;
}

function advance(video, stage, fields = {}, now = Date.now()) {
  const next = { ...video, ...fields, stage };
  if (stage === 'watched' || stage === 'learned') next.watchedAt = video.watchedAt || now;
  if (stage === 'learned') next.learnedAt = video.learnedAt || now;
  if (stage === 'saved') { next.watchedAt = null; next.learnedAt = null; }
  if (stage === 'watched') next.learnedAt = null;
  return next;
}

function createExperiment({ videoId, projectId, plan }, now = Date.now()) {
  return { id: uid(), videoId, projectId, plan: plan.trim(), status: 'queued', result: '', createdAt: now, updatedAt: now, doneAt: null };
}

function setExperimentStatus(exp, status, result, now = Date.now()) {
  const done = status === 'won' || status === 'flopped';
  return { ...exp, status, result: result ?? exp.result, updatedAt: now, doneAt: done ? (exp.doneAt || now) : null };
}

function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

/** Window start for "last N days" (inclusive of today). days = Infinity → everything. */
function windowStart(days, now = Date.now()) {
  if (!Number.isFinite(days)) return 0;
  return startOfDay(now) - (days - 1) * DAY;
}

const inWin = (ts, since) => ts != null && ts >= since;

/** Headline numbers for a period. */
function periodStats(state, days, now = Date.now()) {
  const since = windowStart(days, now);
  const v = state.videos;
  const e = state.experiments;
  return {
    saved: v.filter(x => inWin(x.addedAt, since)).length,
    watched: v.filter(x => inWin(x.watchedAt, since)).length,
    learned: v.filter(x => inWin(x.learnedAt, since)).length,
    applied: e.filter(x => inWin(x.createdAt, since)).length,
    won: e.filter(x => x.status === 'won' && inWin(x.doneAt, since)).length,
    backlog: v.filter(x => x.stage === 'saved').length,
  };
}

/** Per-topic breakdown for a period: watched / learned / applied / won / backlog. */
function topicStats(state, days, now = Date.now()) {
  const since = windowStart(days, now);
  const byVideo = new Map(state.videos.map(v => [v.id, v]));
  const rows = allTopics(state).map(t => ({ ...t, watched: 0, learned: 0, applied: 0, won: 0, backlog: 0 }));
  const idx = new Map(rows.map(r => [r.id, r]));
  const untagged = { id: '_none', name: 'Untagged', color: '#64748b', watched: 0, learned: 0, applied: 0, won: 0, backlog: 0 };
  const rowsFor = topics => (topics.length ? topics.map(id => idx.get(id)).filter(Boolean) : [untagged]);

  for (const v of state.videos) {
    for (const r of rowsFor(v.topics)) {
      if (inWin(v.watchedAt, since)) r.watched++;
      if (inWin(v.learnedAt, since)) r.learned++;
      if (v.stage === 'saved') r.backlog++;
    }
  }
  for (const ex of state.experiments) {
    const v = byVideo.get(ex.videoId);
    if (!v) continue;
    for (const r of rowsFor(v.topics)) {
      if (inWin(ex.createdAt, since)) r.applied++;
      if (ex.status === 'won' && inWin(ex.doneAt, since)) r.won++;
    }
  }
  const all = untagged.watched + untagged.learned + untagged.backlog + untagged.applied ? [...rows, untagged] : rows;
  return all;
}

/** Topics you keep saving but never actually learn — the gap between collecting and knowing. */
function blindSpots(state, days, now = Date.now()) {
  return topicStats(state, days, now)
    .filter(r => r.id !== '_none' && r.backlog >= 2 && r.learned === 0)
    .sort((a, b) => b.backlog - a.backlog);
}

/** Consecutive days (ending today, or yesterday if nothing yet today) with at least one video learned. */
function learningStreak(state, now = Date.now()) {
  const days = new Set(state.videos.filter(v => v.learnedAt).map(v => startOfDay(v.learnedAt)));
  let day = startOfDay(now);
  if (!days.has(day)) day -= DAY;
  let streak = 0;
  while (days.has(day)) { streak++; day -= DAY; }
  return streak;
}

function totalXp(state) {
  let xp = 0;
  for (const v of state.videos) {
    xp += XP.saved;
    if (v.watchedAt) xp += XP.watched;
    if (v.learnedAt) xp += XP.learned;
  }
  for (const e of state.experiments) {
    xp += XP.applied;
    if (e.status === 'won') xp += XP.won;
  }
  return xp;
}

function levelFor(xp) {
  const level = Math.floor(Math.sqrt(xp / 10)) + 1;
  const cur = 10 * (level - 1) ** 2;
  const next = 10 * level ** 2;
  return { level, progress: (xp - cur) / (next - cur), toNext: next - xp };
}

/**
 * Today's picks: unwatched saves, favouring topics you've learned least about recently
 * (so the backlog stays balanced), then oldest first so nothing rots.
 */
function todaysPicks(state, n = 3, now = Date.now()) {
  const recent = new Map(topicStats(state, 30, now).map(r => [r.id, r.learned]));
  const weight = v => (v.topics.length ? Math.min(...v.topics.map(t => recent.get(t) ?? 0)) : 0);
  const pool = state.videos.filter(v => v.stage === 'saved');
  pool.sort((a, b) => weight(a) - weight(b) || a.addedAt - b.addedAt);
  const picks = [];
  const usedTopics = new Set();
  for (const v of pool) {
    if (picks.length >= n) break;
    const primary = v.topics[0] || '_none';
    if (usedTopics.has(primary)) continue;
    picks.push(v);
    usedTopics.add(primary);
  }
  for (const v of pool) {
    if (picks.length >= n) break;
    if (!picks.includes(v)) picks.push(v);
  }
  return picks;
}

/** Markdown playbook of everything learned + applied for a project — paste into a client doc or brief. */
function projectPlaybook(state, projectId) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return '';
  const byVideo = new Map(state.videos.map(v => [v.id, v]));
  const topicName = new Map(allTopics(state).map(t => [t.id, t.name]));
  const exps = state.experiments.filter(e => e.projectId === projectId);
  const lines = [`# ${project.name} — Playbook`, '', `_Exported from Reel2Real on ${new Date().toISOString().slice(0, 10)}_`, ''];
  for (const st of EXP_STATUSES) {
    const group = exps.filter(e => e.status === st.id);
    if (!group.length) continue;
    lines.push(`## ${st.emoji} ${st.label} (${group.length})`, '');
    for (const e of group) {
      const v = byVideo.get(e.videoId);
      const tags = v?.topics.map(t => topicName.get(t)).filter(Boolean).join(', ');
      lines.push(`- **${e.plan}**`);
      if (v?.insight) lines.push(`  - Insight: ${v.insight}`);
      if (tags) lines.push(`  - Topics: ${tags}`);
      if (e.result) lines.push(`  - Result: ${e.result}`);
      if (v) lines.push(`  - Source: ${v.url}`);
    }
    lines.push('');
  }
  return lines.join('\n');
}

/** Merge an imported backup into the current state (by id, imported wins). */
function mergeState(current, incoming) {
  const merge = (a = [], b = []) => {
    const m = new Map(a.map(x => [x.id, x]));
    for (const x of b) m.set(x.id, x);
    return [...m.values()];
  };
  return {
    version: 1,
    videos: merge(current.videos, incoming.videos),
    projects: merge(current.projects, incoming.projects),
    experiments: merge(current.experiments, incoming.experiments),
    customTopics: merge(current.customTopics, incoming.customTopics),
  };
}

// ---------- cloud sync shape: one small document per record ----------
const KINDS = [['v', 'videos'], ['e', 'experiments'], ['p', 'projects'], ['t', 'customTopics']];

/** state → Map of docKey → {kind, item}. Keys are stable, so a diff tells what to write. */
function toDocs(state) {
  const out = new Map();
  for (const [prefix, field] of KINDS) {
    for (const item of state[field] || []) out.set(`${prefix}_${item.id}`, { kind: field, item });
  }
  return out;
}

/** Rebuild state from synced documents ({id, body}[]), newest videos/experiments first. */
function fromDocs(docs) {
  const s = emptyState();
  for (const { body } of docs) {
    if (body && Array.isArray(s[body.kind]) && body.item?.id) s[body.kind].push(body.item);
  }
  s.videos.sort((a, b) => b.addedAt - a.addedAt);
  s.experiments.sort((a, b) => b.createdAt - a.createdAt);
  s.projects.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  return s;
}

/** What to write to make the remote match local: keys to set (with body) and keys to delete. */
function diffDocs(local, remote) {
  const set = [];
  const del = [];
  for (const [key, body] of local) {
    const prev = remote.get(key);
    if (!prev || JSON.stringify(prev) !== JSON.stringify(body)) set.push([key, body]);
  }
  for (const key of remote.keys()) if (!local.has(key)) del.push(key);
  return { set, del };
}


const STORE_KEY = 'reel2real:v1';
const UI_KEY = 'reel2real:ui';
const PROJECT_COLORS = ['#ff4f81', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#14b8a6', '#ef4444', '#ec4899'];

// ---------- state ----------
let state = load(STORE_KEY) || emptyState();
const ui = { tab: 'today', stage: 'all', topic: 'all', q: '', period: 10, ...(load(UI_KEY) || {}) };

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
// Inside a claude.ai Artifact the page gets `window.claude`; there we sync to the account (db capability).
const IN_ARTIFACT = typeof window.claude?.use === 'function';

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { if (!IN_ARTIFACT) toast('Could not save — storage is full or blocked'); }
  schedulePush();
}

// ---------- cloud sync (Artifact only): one private document per record under data/users/<you> ----------
const cloud = { col: null, remote: new Map(), ready: false, timer: null, chain: Promise.resolve(), failed: false };

function schedulePush() {
  if (!cloud.ready) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(() => { cloud.chain = cloud.chain.then(pushNow); }, 400);
}

async function pushNow() {
  const { set, del } = diffDocs(toDocs(state), cloud.remote);
  try {
    for (const [key, body] of set) { await cloud.col.doc(key).set(body); cloud.remote.set(key, body); }
    for (const key of del) { await cloud.col.doc(key).delete(); cloud.remote.delete(key); }
    if (cloud.failed) { cloud.failed = false; renderVitals(); }
  } catch (err) {
    cloud.failed = true;
    renderVitals();
    toast(err?.code === 'quota_exceeded' ? 'Cloud storage is full — export a backup and delete old videos' : 'Could not sync — your changes are kept on this device and will retry');
  }
}

async function connectCloud() {
  if (!IN_ARTIFACT) return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  const id = db && user ? await user.id() : null;
  if (!id) return;
  cloud.col = db.collection(`data/users/${id}`);
  cloud.col.onSnapshot(snap => {
    if (snap.metadata.fromCache && !cloud.ready) return;
    const docs = snap.docs.map(d => ({ id: d.id, body: d.data() }));
    cloud.remote = new Map(docs.map(d => [d.id, d.body]));
    if (!cloud.ready) {
      cloud.ready = true;
      // First sync on a device: an empty account adopts what this browser already has.
      if (snap.empty && state.videos.length + state.projects.length) { schedulePush(); renderVitals(); return; }
    }
    if (snap.metadata.hasPendingWrites) return;
    const next = fromDocs(docs);
    if (diffDocs(toDocs(next), toDocs(state)).set.length || diffDocs(toDocs(state), toDocs(next)).set.length) {
      state = next;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* cache only */ }
      render();
    } else renderVitals();
  }, () => { cloud.ready = false; cloud.failed = true; renderVitals(); });
}
function saveUi() {
  try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: ui.tab, period: ui.period, theme: ui.theme })); } catch { /* optional */ }
}
function commit(msg) {
  save();
  render();
  if (msg) toast(msg);
}

function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d ago`;
  return new Date(ts).toLocaleDateString();
}

// ---------- actions ----------
function addVideo({ url, note, topics, title }) {
  const clean = extractUrl(url) || url.trim();
  if (!/^https?:\/\//i.test(clean)) { toast('Paste a full link (https://…)'); return null; }
  const dup = findDuplicate(state, clean);
  if (dup) { toast('Already in your library — bumped it to the top of the queue'); dup.addedAt = Date.now(); commit(); return dup; }
  const v = createVideo({ url: clean, note, title, topics });
  state.videos.unshift(v);
  commit('Video added');
  if (v.platform === 'youtube' && !v.title) fetchYoutubeTitle(v.id, clean);
  return v;
}

async function fetchYoutubeTitle(id, url) {

// ---------- action points: what to do with a video, and in which project ----------
const aiBusy = new Set();

async function generateActions(id, { silent = false } = {}) {
  const v = videoById(id);
  if (!v) return;
  const source = [v.title, v.note].filter(Boolean).join('\n').trim();
  if (source.length < 12) {
    if (!silent) askForCaption(id);
    return;
  }
  const sample = IN_ARTIFACT ? await window.claude.use('sample') : null;
  if (!sample) {
    if (!silent) toast('Automatic action points work in the Claude web app. Here, add them with ⋯ → Action points.');
    return;
  }
  aiBusy.add(id);
  render();
  const topics = allTopics(state).map(t => `${t.id} = ${t.name}`).join(', ');
  const projects = state.projects.length
    ? state.projects.map(p => `- id "${p.id}": ${p.name}${p.context ? ` (${p.context})` : ''}`).join('\n')
    : '(none yet)';
  try {
    const out = await sample.json(`You turn short marketing knowledge videos (Instagram reels, YouTube) into things a digital marketer will actually DO.
Video notes (caption or the user's own words):
${source}

The user's projects:
${projects}

Return JSON only:
{"title": string (max 8 words, what the video teaches),
 "summary": string (what the video teaches, max 35 words),
 "actions": string[] (3 to 5 concrete steps to implement it, each max 20 words, start with a verb, in order),
 "projectId": string (id of the project where this fits best, or "" if none fit),
 "why": string (max 20 words: why that project, or "" if none),
 "topics": string[] (1-2 ids from: ${topics})}
Use only what the notes say; do not invent statistics or claims. If the notes are too thin, keep steps general and say so in summary.`, { modelTier: 'default' });
    const cur = videoById(id);
    if (!cur) return;
    if (out.title && !cur.title) cur.title = String(out.title).slice(0, 80);
    if (out.summary) cur.summary = String(out.summary);
    if (!cur.insight && out.summary) Object.assign(cur, advance(cur, 'learned', { insight: String(out.summary) }));
    if (Array.isArray(out.actions)) cur.actions = out.actions.filter(Boolean).slice(0, 6).map(text => ({ text: String(text), done: false }));
    cur.projectId = state.projects.some(p => p.id === out.projectId) ? out.projectId : '';
    cur.projectWhy = cur.projectId ? String(out.why || '') : '';
    if (Array.isArray(out.topics) && !cur.topics.length) cur.topics = out.topics.filter(t => allTopics(state).some(x => x.id === t));
    aiBusy.delete(id);
    commit('Action points ready');
  } catch (err) {
    aiBusy.delete(id);
    render();
    if (!silent || err?.code !== 'not_granted') toast(err?.code === 'not_granted' ? 'AI permission was declined' : 'Could not create action points — tap “Get action points” to retry');
  }
}

function download(name, text, type = 'application/json') {

}

// ---------- rendering ----------
// One video = one learning tracker: ① what I learned → ② action points → ③ project.
function videoCard(v) {
  const exps = expsFor(v.id);
  const pm = projectMap();
  const steps = v.actions || [];
  const doneSteps = steps.filter(a => a.done).length;
  const busy = aiBusy.has(v.id);
  const proj = pm.get(v.projectId) || pm.get(exps[0]?.projectId);
  const statusOf = id => EXP_STATUSES.find(x => x.id === id);

  const learned = busy ? '<p class="muted working">Reading the caption…</p>'
    : v.insight
      ? `<p>${esc(v.insight)}</p>`
      : `<p class="muted">Not filled yet.</p>
         <button class="btn small primary" data-action="${IN_ARTIFACT ? 'gen-actions' : 'learn'}" data-id="${v.id}">${IN_ARTIFACT ? 'Fill in steps 1–3 with AI' : 'Write what I learned'}</button>`;

  const todo = busy ? '<p class="muted working">Writing the steps…</p>'
    : steps.length
      ? `<ul>${steps.map((a, i) => `<li class="${a.done ? 'done' : ''}"><label>
          <input type="checkbox" data-action="toggle-step" data-id="${v.id}" data-i="${i}" ${a.done ? 'checked' : ''}><span>${esc(a.text)}</span></label></li>`).join('')}</ul>`
      : `<p class="muted">No steps yet.</p>${v.insight ? `<button class="btn small" data-action="${IN_ARTIFACT ? 'gen-actions' : 'edit'}" data-id="${v.id}">${IN_ARTIFACT ? 'Get action points' : 'Add steps'}</button>` : ''}`;

  let where;
  if (exps.length) {
    where = exps.map(e => {
      const p = pm.get(e.projectId);
      const st = statusOf(e.status);
      return `<p><b style="color:${p?.color || 'inherit'}">${esc(p?.name || 'Project')}</b> · <span class="status s-${e.status}">${st.label}</span>${e.result ? ` — ${esc(e.result)}` : ''}</p>`;
    }).join('') + '<p class="hint">Update the status in the Lab tab.</p>';
  } else if (busy) {
    where = '<p class="muted working">Picking the best project…</p>';
  } else if (!state.projects.length) {
    where = `<p class="muted">You haven't added any projects yet.</p><button class="btn small" data-action="new-project">+ Add my first project</button>`;
  } else {
    where = `${proj ? `<p>Best fit: <b style="color:${proj.color}">${esc(proj.name)}</b>${v.projectWhy ? ` — ${esc(v.projectWhy)}` : ''}</p>` : '<p class="muted">Not linked to a project yet.</p>'}
      <button class="btn small primary" data-action="apply" data-id="${v.id}">Start in ${proj ? esc(proj.name) : 'a project'}</button>`;
  }

  const stepClass = n => (n === 1 ? v.insight : n === 2 ? steps.length && doneSteps === steps.length : exps.length) ? 'step on' : 'step';
  return `
  <article class="card video">
    <header class="vhead">
      <a class="plat ${v.platform}" href="${esc(v.url)}" target="_blank" rel="noopener" title="Watch">${PLATFORM_ICON[v.platform] || 'URL'}</a>
      <div class="vtitle">
        <div class="title">${esc(displayTitle(v))}</div>
        <div class="meta">${PLATFORM_NAME[v.platform]} · saved ${ago(v.addedAt)}${v.topics.length ? ' · ' : ''}${v.topics.map(t => esc(topicMap().get(t)?.name || '')).filter(Boolean).join(', ')}</div>
      </div>
      <a class="btn small watch" href="${esc(v.url)}" target="_blank" rel="noopener">Watch ↗</a>
      <button class="btn small ghost" data-action="edit" data-id="${v.id}" aria-label="Edit">⋯</button>
    </header>
    ${!IN_ARTIFACT && embedUrl(v.url) ? `<button class="linkish" data-action="play" data-id="${v.id}">Play here</button><div class="player" id="player-${v.id}" hidden></div>` : ''}
    <ol class="flow">
      <li class="${stepClass(1)}"><h4><span>1</span>What I learned</h4>${learned}</li>
      <li class="${stepClass(2)}"><h4><span>2</span>Action points${steps.length ? ` <em>${doneSteps}/${steps.length} done</em>` : ''}</h4>${todo}</li>
      <li class="${stepClass(3)}"><h4><span>3</span>Project</h4>${where}</li>
    </ol>
  </article>`;
}

function wireCapture() {
  const form = $('#capture');
  if (!form) return;
  let touched = !!pendingShare?.topics?.length;
  form.querySelectorAll('input[name=topics]').forEach(cb => cb.addEventListener('change', () => { touched = true; }));
  const autoTag = () => {
    if (touched) return;
    const ids = new Set(suggestTopics(form.note.value, allTopics(state)).slice(0, 3));
    form.querySelectorAll('input[name=topics]').forEach(cb => { cb.checked = ids.has(cb.value); });
  };
  form.note.addEventListener('input', autoTag);
  form.url.addEventListener('paste', () => setTimeout(() => {
    const raw = form.url.value;
    const url = extractUrl(raw);
    if (url && url !== raw) {
      form.url.value = url;
      if (!form.note.value) form.note.value = raw.replace(url, '').trim();
      autoTag();
    }
  }));
  if (pendingShare) { form.note.focus(); autoTag(); }
  form.addEventListener('submit', e => {
    e.preventDefault();
    const many = extractUrls(`${form.url.value}\n${form.note.value}`);
    if (many.length > 1) { pendingShare = null; return bulkAdd(many); }
    const shared = pendingShare;
    pendingShare = null;
    const v = addVideo({ url: form.url.value, note: form.note.value, topics: new FormData(form).getAll('topics') });
    if (!v) { pendingShare = shared; return; }
    if (e.submitter?.value === 'learn') openLearn(v.id);
    else if (IN_ARTIFACT && !v.actions?.length) generateActions(v.id);
  });
}

function bulkAdd(urls) {
  const fresh = urls.filter(u => !findDuplicate(state, u));
  for (const url of fresh.reverse()) {
    const v = createVideo({ url });
    state.videos.unshift(v);
    if (v.platform === 'youtube') fetchYoutubeTitle(v.id, url);
  }
  const skipped = urls.length - fresh.length;
  commit(`Added ${fresh.length} video${fresh.length === 1 ? '' : 's'} to your queue${skipped ? ` (${skipped} already saved)` : ''}`);
}

async function pasteFromClipboard() {
  const form = $('#capture');
  let raw = '';
  try { raw = await navigator.clipboard.readText(); } catch {
    form.url.focus();
    toast('Paste the link into the box (Ctrl+V, or long-press → Paste)');
    return;
  }
  const urls = extractUrls(raw);
  if (!urls.length) { toast('No link on your clipboard — in Instagram/YouTube tap Share → Copy link first'); return; }
  if (urls.length > 1) return bulkAdd(urls);
  const url = urls[0];
  form.url.value = url;
  const caption = raw.replace(url, '').trim();
  if (caption && !form.note.value) form.note.value = caption;
  form.note.dispatchEvent(new Event('input'));
  form.note.focus();
  toast(`Link pasted from ${detectPlatform(url)} — add a few words & save`);
}

function renderLibrary() {
  const tm = topicMap();
  const q = ui.q.toLowerCase();
  const applied = new Set(state.experiments.map(e => e.videoId));
  const list = state.videos.filter(v => {
    if (ui.stage === 'applied' ? !applied.has(v.id) : ui.stage !== 'all' && v.stage !== ui.stage) return false;
    if (ui.topic !== 'all' && !v.topics.includes(ui.topic)) return false;
    if (q && !`${v.title} ${v.note} ${v.insight} ${v.idea} ${v.url}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const stages = [['all', 'All'], ['saved', 'Queue'], ['watched', 'Watched'], ['learned', 'Learned'], ['applied', 'Applied']];
  $('#view-library').innerHTML = `
    <input class="search" type="search" placeholder="Search titles, notes, learnings…" value="${esc(ui.q)}" data-input="q">
    <div class="filters"><div class="seg">${stages.map(([id, l]) => `<button class="${ui.stage === id ? 'on' : ''}" data-action="stage" data-id="${id}">${l}</button>`).join('')}</div></div>
    <div class="filters">
      <button class="chip ${ui.topic === 'all' ? '' : 'off'}" data-action="topic" data-id="all">All topics</button>
      ${allTopics(state).map(t => `<button class="chip ${ui.topic === t.id ? '' : 'off'}" style="--c:${t.color}" data-action="topic" data-id="${t.id}">${esc(t.name)}</button>`).join('')}
    </div>
    <p class="hint">${list.length} video${list.length === 1 ? '' : 's'}${ui.topic !== 'all' ? ` in ${esc(tm.get(ui.topic)?.name)}` : ''}</p>
    ${list.length ? list.map(videoCard).join('') : '<div class="card empty">Nothing here yet.</div>'}`;
}

function expRow(e) {
  const v = videoById(e.videoId);
  const p = projectMap().get(e.projectId);
  return `
  <div class="exp ${e.status}">
    <div class="plan">${esc(e.plan)}</div>
    <div class="from">${p ? `<b style="color:${p.color}">${esc(p.name)}</b> · ` : ''}from: ${v ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.insight || displayTitle(v))}</a>` : 'deleted video'} · ${ago(e.createdAt)}</div>
    ${e.result ? `<div class="result">${esc(e.result)}</div>` : ''}
    <div class="status-row">${EXP_STATUSES.map(s => `<button class="${e.status === s.id ? 'on' : ''}" data-action="status" data-id="${e.id}" data-status="${s.id}">${s.label}</button>`).join('')}
      <button data-action="del-exp" data-id="${e.id}" title="Remove experiment">✕</button></div>
  </div>`;
}

function renderLab() {
  const order = { testing: 0, queued: 1, won: 2, flopped: 3 };
  const waiting = state.videos.filter(v => v.stage === 'learned' && !expsFor(v.id).length);
  $('#view-lab').innerHTML = `
    <div>
      <p class="hero">Projects</p>
      <p class="sub">Every learning becomes an experiment on a real project. Track what worked, kill what didn't.</p>
    </div>
    ${waiting.length ? `<h2>${waiting.length} learning${waiting.length > 1 ? 's' : ''} looking for a home</h2>${waiting.slice(0, 5).map(videoCard).join('')}` : ''}
    <h2>Projects</h2>
    ${state.projects.map(p => {
      const exps = state.experiments.filter(e => e.projectId === p.id).sort((a, b) => order[a.status] - order[b.status] || b.updatedAt - a.updatedAt);
      const won = exps.filter(e => e.status === 'won').length;
      return `
      <div class="card">
        <div class="project-head">
          <span class="dot" style="background:${p.color}"></span>
          <h3>${esc(p.name)}</h3>
          <div class="row">
            <span class="hint">${exps.length} action${exps.length === 1 ? '' : 's'} · ${won} worked</span>
            ${exps.length ? `<button class="btn small ghost" data-action="playbook" data-id="${p.id}" title="Copy playbook as Markdown">Copy playbook</button>` : ''}
            <button class="btn small ghost" data-action="edit-project" data-id="${p.id}">⋯</button>
          </div>
        </div>
        ${p.context ? `<p class="hint" style="margin:6px 0 0">${esc(p.context)}</p>` : ''}
        ${exps.length ? exps.map(expRow).join('') : '<p class="hint">No experiments yet. Hit “Apply to project” on any learning.</p>'}
      </div>`;
    }).join('')}
    <div class="card stack">
      <button class="btn primary" data-action="new-project">+ Connect a project</button>
    </div>`;
}

function renderMap() {
  const days = ui.period === 'all' ? Infinity : Number(ui.period);
  const st = periodStats(state, days);
  const rows = topicStats(state, days).filter(r => r.watched || r.learned || r.applied || r.backlog);
  const learnedRows = rows.filter(r => r.learned).sort((a, b) => b.learned - a.learned);
  const spots = blindSpots(state, days);
  const max = Math.max(1, ...rows.map(r => Math.max(r.learned, r.applied)));
  const label = days === Infinity ? 'All time' : `Last ${days} days`;
  const periods = [7, 10, 30, 90, 'all'];
  const funnel = [['Saved', st.saved], ['Watched', st.watched], ['Learned', st.learned], ['Applied', st.applied], ['Won', st.won]];
  const fmax = Math.max(1, ...funnel.map(f => f[1]));
  const wins = state.experiments.filter(e => e.status === 'won').sort((a, b) => b.doneAt - a.doneAt).slice(0, 6);
  const bank = allTopics(state).map(t => ({ t, vids: state.videos.filter(v => v.insight && v.topics.includes(t.id)) })).filter(x => x.vids.length);

  $('#view-map').innerHTML = `
    <div class="seg">${periods.map(p => `<button class="${String(ui.period) === String(p) ? 'on' : ''}" data-action="period" data-id="${p}">${p === 'all' ? 'All' : `${p}d`}</button>`).join('')}</div>
    <div>
      <p class="sub">${label}</p>
      <p class="hero">You watched <em>${st.watched}</em> video${st.watched === 1 ? '' : 's'} and learned <em>${st.learned}</em> thing${st.learned === 1 ? '' : 's'}${learnedRows.length ? ` — ${learnedRows.slice(0, 3).map(r => `${r.learned} ${esc(r.name)}`).join(', ')}` : ''}.</p>
      <p class="sub">${st.applied} applied to projects · ${st.won} win${st.won === 1 ? '' : 's'} · ${st.backlog} still in the queue</p>
    </div>

    <div class="card"><h2>From scroll to result</h2>
      <div class="funnel">${funnel.map(([l, n]) => `<div><b style="width:${Math.max(8, (n / fmax) * 78)}%">${n}</b><span>${l}</span></div>`).join('')}</div>
    </div>

    <div class="card"><h2>Knowledge by topic</h2>
      <div class="legend" style="margin-bottom:10px"><span style="--c:var(--text)">Applied</span><span style="--c:var(--text);--o:.3">Learned, not applied</span></div>
      ${rows.length ? `<div class="bars">${rows.sort((a, b) => b.learned - a.learned || b.backlog - a.backlog).map(r => {
        const appliedW = (Math.min(r.applied, r.learned || r.applied) / max) * 100;
        const learnedW = (Math.max(0, r.learned - r.applied) / max) * 100;
        return `<div class="bar-row"><span class="name" style="color:${r.color}">${esc(r.name)}</span>
          <span class="bar"><i style="width:${appliedW}%;background:${r.color}"></i><i style="width:${learnedW}%;background:${r.color};opacity:.3"></i></span>
          <span class="num" title="learned · applied · in queue">${r.learned} · ${r.applied}${r.backlog ? ` · <span title="in queue">+${r.backlog} queued</span>` : ''}</span></div>`;
      }).join('')}</div>` : '<p class="hint">Nothing in this window yet.</p>'}
    </div>

    ${spots.length ? `<div class="card"><h2>Blind spots</h2>
      <p class="sub">You keep <b>saving</b> these but haven't <b>learned</b> from them in this window:</p>
      <div class="chips" style="margin-top:8px">${spots.map(r => `<button class="chip" style="--c:${r.color}" data-action="goto-topic" data-id="${r.id}">${esc(r.name)} · ${r.backlog} waiting</button>`).join('')}</div></div>` : ''}

    ${wins.length ? `<div class="card"><h2>What worked</h2>${wins.map(e => {
      const v = videoById(e.videoId);
      const p = projectMap().get(e.projectId);
      return `<div class="exp"><div class="plan">${esc(e.plan)}</div>
        <div class="from">${p ? `<b style="color:${p.color}">${esc(p.name)}</b> · ` : ''}${v ? staticTopicChips(v.topics.slice(0, 2)) : ''}</div>
        ${e.result ? `<div class="result">${esc(e.result)}</div>` : ''}</div>`;
    }).join('')}</div>` : ''}

    <div class="card"><h2>Knowledge bank</h2>
      ${bank.length ? bank.map(({ t, vids }) => `
        <details><summary style="cursor:pointer;padding:6px 0"><b style="color:${t.color}">${esc(t.name)}</b> <span class="hint">${vids.length} learning${vids.length > 1 ? 's' : ''}</span></summary>
          <ul style="margin:4px 0 10px;padding-left:20px">${vids.map(v => `<li style="margin:4px 0">${esc(v.insight)} <a class="hint" href="${esc(v.url)}" target="_blank" rel="noopener">↗</a></li>`).join('')}</ul>
        </details>`).join('') : '<p class="hint">Every learning you log lands here, grouped by topic — your personal marketing playbook.</p>'}
    </div>`;
}

function render() {
  renderVitals();
  const views = { today: renderToday, library: renderLibrary, lab: renderLab, map: renderMap };
  views[ui.tab]();
  document.querySelectorAll('.view').forEach(s => { s.hidden = s.dataset.view !== ui.tab; });
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
}

function go(tab) {
  ui.tab = tab;
  saveUi();
  render();
  window.scrollTo({ top: 0 });
}

// ---------- events ----------
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) return go(tab.dataset.tab);
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;
  switch (action) {
    case 'watched': return markWatched(id);
    case 'play': {
      const box = document.getElementById(`player-${id}`);
      if (!box) return;
      if (box.hidden) {
        box.innerHTML = `<iframe src="${esc(embedUrl(videoById(id).url))}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="Video player"></iframe>`;
        box.hidden = false;
        el.textContent = 'Hide player';
      } else {
        box.innerHTML = '';
        box.hidden = true;
        el.textContent = 'Play here';
      }
      return;
    }
    case 'learn': return openLearn(id);
    case 'apply': return openApply(id);
    case 'edit': return openEdit(id);
    case 'status': return setStatus(id, el.dataset.status);
    case 'del-exp':
      askConfirm('Remove this experiment?', 'Remove').then(ok => {
        if (ok) { state.experiments = state.experiments.filter(x => x.id !== id); commit('Experiment removed'); }
      });
      return;
    case 'playbook': return copyPlaybook(id);
    case 'new-project': return openProject();
    case 'edit-project': return openProject(id);
    case 'stage': ui.stage = id; return render();
    case 'topic': ui.topic = id; return render();
    case 'period': ui.period = id === 'all' ? 'all' : Number(id); saveUi(); return render();
    case 'goto-topic': ui.topic = id; ui.stage = 'saved'; return go('library');
    case 'open-settings': return openSettings();
    case 'ai-fill': return aiFill(id, el);
    case 'gen-actions': return generateActions(id);
    case 'toggle-step': {
      const v = videoById(id);
      const step = v?.actions?.[Number(el.dataset.i)];
      if (!step) return;
      step.done = el.checked;
      const left = v.actions.filter(a => !a.done).length;
      return commit(step.done ? (left ? `Nice — ${left} step${left > 1 ? 's' : ''} left` : 'All action points done') : '');
    }
    case 'paste': return pasteFromClipboard();
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.input === 'q') {
    ui.q = e.target.value;
    const pos = e.target.selectionStart;
    renderLibrary();
    const s = document.querySelector('[data-input="q"]');
    s.focus();
    s.setSelectionRange(pos, pos);
  }
});

// Share target (Android) and ?url= deep links (bookmarklets, automations).
function ingestShare() {
  const params = new URLSearchParams(location.search);
  const raw = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ');
  if (!raw) return;
  const url = extractUrl(raw);
  history.replaceState(null, '', location.pathname);
  if (!url) return;
  const note = raw.replace(url, '').replace(/\s+/g, ' ').trim();
  const dup = findDuplicate(state, url);
  if (dup) { toast('Already saved — it’s in your library'); return; }
  pendingShare = { url, note, topics: suggestTopics(note, allTopics(state)).slice(0, 3) };
  ui.tab = 'today';
  if (params.get('save') === '1') {
    addVideo(pendingShare);
    pendingShare = null;
  }
}

window.addEventListener('storage', e => { if (e.key === STORE_KEY) { state = load(STORE_KEY) || emptyState(); render(); } });

applyTheme();
ingestShare();
render();
connectCloud();
if (pendingShare) toast(`Got it from ${detectPlatform(pendingShare.url)} — add a note & save`);

if ('serviceWorker' in navigator && location.protocol !== 'file:' && !IN_ARTIFACT) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
</body>
